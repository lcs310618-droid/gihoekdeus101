<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기획듀스 101</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121110'/%3E%3Ccircle cx='32' cy='34' r='16' fill='%23F5C542'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* layout: one phone-width column, sticky top bar, fixed bottom tabs; thumbnails are SVG so they scale like a real home feed */
:root{
  --bg:#121110; --surface:#1B1917; --surface-2:#262320; --line:#38322A; --fg:#F3EEE5; --muted:#A39B8E;
  --accent:#F5C542; --accent-fg:#1C1300; --accent-text:#F5C542; --good:#62C48E; --warn:#E8A14F; --bad:#E36A6A;
  --thumb-bg:#0E0D0C;
  --font-body:'IBM Plex Sans KR',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-display:'Black Han Sans','IBM Plex Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F6F2EA; --surface:#FFFFFF; --surface-2:#EEE8DC; --line:#DCD3C3; --fg:#1C1813; --muted:#6E6657;
  --accent:#F0BC2E; --accent-fg:#1C1300; --accent-text:#8B6300; --good:#1E8A52; --warn:#B86A14; --bad:#C23B3B;
  color-scheme:light;
} }
:root[data-theme="light"]{
  --bg:#F6F2EA; --surface:#FFFFFF; --surface-2:#EEE8DC; --line:#DCD3C3; --fg:#1C1813; --muted:#6E6657;
  --accent:#F0BC2E; --accent-fg:#1C1300; --accent-text:#8B6300; --good:#1E8A52; --warn:#B86A14; --bad:#C23B3B;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--font-display);font-size:22px;letter-spacing:.5px;color:var(--fg);line-height:1}
.brand b{color:var(--accent)}
.week{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:10px;padding:10px 16px;font-weight:500;font-size:14px;cursor:pointer}
.gbtn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;line-height:1.5;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill.good{border-color:var(--good);color:var(--good)}
.pill.acc{border-color:var(--accent-text);color:var(--accent-text)}
.pill.eye{border-style:dashed;color:var(--muted)}
.pill.eye b{font-weight:500;color:var(--fg)}
.pill.eye::before{content:"\1F512";font-size:10px}

main{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700;line-height:1.3}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note.acc{border-left:3px solid var(--accent);border-radius:0 10px 10px 0;color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:500;font-size:14px;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12.5px;border-radius:8px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;min-width:0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent-text)}
.tab .dot{position:absolute}

.feed{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:520px){.feed{grid-template-columns:1fr 1fr;gap:16px}}
.tile{display:block;text-align:left;background:transparent;border:0;padding:0;color:inherit;width:100%;min-width:0}
.thumb{width:100%;max-width:100%;aspect-ratio:16/9;display:block;border-radius:10px;background:var(--thumb-bg);overflow:hidden}
.thumb text{font-family:var(--font-display);paint-order:stroke;stroke:#000;stroke-width:4;stroke-linejoin:round}
.thumb .t1{fill:#FFFFFF}
.thumb .t2{fill:#FFD24A}
.tile-title{margin-top:8px;font-weight:500;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-meta{margin-top:3px;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tile.picked .thumb{outline:3px solid var(--accent);outline-offset:-3px}
.tabs-in .tab{font-size:10.5px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:500;color:var(--muted)}
.field label b{color:var(--accent-text);font-weight:700}
.field input,.field textarea,.field select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14.5px;color:var(--fg);min-width:0}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.field .hint.bad{color:var(--bad)}
.field .hint.warn{color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-size:13px;color:var(--muted);min-width:0}
.seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:500}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.match{display:flex;flex-direction:column;gap:10px}
.vs{text-align:center;font-family:var(--font-display);font-size:18px;color:var(--muted);letter-spacing:1px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.mcard .ttl{margin-top:8px;font-weight:500;font-size:15px;line-height:1.4}
.mcard .one{margin-top:3px;font-size:13.5px;color:var(--fg)}
.mcard .one{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.mcard .hook{margin-top:6px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.mcard .hook b{color:var(--accent-text);font-weight:500}
.sec{display:flex;flex-direction:column;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.sec h3{font-size:14px}
.setrow{display:grid;grid-template-columns:38px 1fr 1fr 44px;gap:6px;align-items:center}
.setrow.one{grid-template-columns:38px 1fr}
.setrow input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14.5px;color:var(--fg);min-width:0}
.setlab{font-size:12px;color:var(--muted);font-weight:500}
.setlab b{color:var(--accent-text)}
.alts{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:13px}
.alt{display:grid;grid-template-columns:76px 1fr;gap:8px;min-width:0}
.alt span:last-child{word-break:break-word}
.lnk{color:var(--accent-text);word-break:break-all}
.thumb-img{width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:10px;background:#0E0D0C}
.brow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;color:inherit;min-width:0;cursor:pointer}
.brow .bt{flex:1;min-width:0}
.brow .bt .ttl{font-weight:500;font-size:15px;line-height:1.35}
.brow .bt .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.drop{display:block;border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface-2);cursor:pointer}
.drop input{display:none}
.notebox{margin-top:8px;font-size:13px;background:var(--surface-2);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.notebox b{color:var(--accent-text);font-weight:500}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--accent-text);font-size:13px;font-weight:500;list-style:none;display:flex;align-items:center;gap:4px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";font-size:11px}
details.more[open] summary::before{content:"▾"}
.kv{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;font-size:13.5px;margin-top:8px}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word;min-width:0}
.decide{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
.decide .btn{padding:10px 4px;font-size:13.5px}
.bar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.roundhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.roundhead .big{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--fg)}
.roundhead .big em{color:var(--accent);font-style:normal}

.rank{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{font-family:var(--font-display);font-size:22px;width:30px;color:var(--muted);line-height:1.1;flex:none;text-align:center}
.rank.top .n{color:var(--accent)}
.rank .th{width:104px;flex:none}
.rank .body{flex:1;min-width:0}
.rank .ttl{font-weight:500;font-size:14px;line-height:1.35}
.rank .sc{font-size:12.5px;color:var(--muted);margin-top:2px}
.rank .sc b{color:var(--fg);font-weight:500}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--bg);padding-block:6px;z-index:2}
.cm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cm .head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.cm .txt{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.cm .tk{margin-top:6px;display:grid;grid-template-columns:44px 1fr;gap:3px 8px;font-size:13.5px}
.cm .tk dt{color:var(--muted);font-size:12px}
.cm .tk dd{margin:0;white-space:pre-wrap;word-break:break-word}
.cm .foot{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.composer{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.composer textarea,.composer input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;font-size:14px;min-width:0}
.composer textarea{min-height:56px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:30;max-width:90vw;text-align:center}
.gate{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center}
.gate .card{max-width:420px}
.who{display:flex;align-items:center;gap:8px}
.who img{width:22px;height:22px;border-radius:50%}
table.plain{width:100%;border-collapse:collapse;font-size:13.5px}
table.plain td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.plain td:last-child{text-align:right;white-space:nowrap}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.empty b{color:var(--fg);display:block;margin-bottom:4px;font-weight:500}
</style>
</head>

<script>
(function(){
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES = ['정보성 예능', '인플루언서 게스트 예능', '기타'];
const KINDS = ['단발 소재', '포맷 제안'];
const PHASE = { upload: '카드 모집 중', worldcup: '월드컵 진행 중', results: '결과 공개' };
const DEFAULT_SETTINGS = { wcDays: [2, 5], endHour: 18, target: 16, perPerson: 3, ownerCards: 2, dualPass: 2, detailFrom: 2, pkPerPerson: 3, pkDualPass: 1, pkNoteFrom: 2, override: null, overrideRound: null, schedule: '화·금 16강 · 전날 23:59까지 업로드 · 당일 18:00까지 월드컵 · 18:00 결과 공개' };
const DAYS = '일월화수목금토';

const S = {
  db: null, auth: null, uid: null, email: null, name: '', role: 'member', isOwner: false, canWrite: true, ready: false, profiles: {}, members: [],
  settings: null, settingsLoaded: false, cards: [], runs: [], mine: {}, meta: { comments: {}, likes: {} },
  run: null, tab: 'board', openCard: null, comments: [], unsubComments: null, resultsWeek: null,
  authorsIndex: null, busy: false, draft: null, compose: { types: [TYPES[0]], kind: KINDS[0], revisedFrom: null }, wcCommentOpen: {},
  roundLocks: {}, publicResults: {}, participation: [], commentsKey: '', commentStops: [], battles: [], pkOpen: null, pkEntries: [], unsubEntries: null, pkRuns: {}, pkPublic: [], pkImg: null, pkNew: false
};

/* ---------- helpers ---------- */
function toast(msg, ms) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(t._tm); t._tm = setTimeout(() => { t.hidden = true; }, ms || 2200);
}
function thumbSVG(t1, t2) {
  const sz = s => Math.min(36, Math.floor(300 / Math.max((s || '').length, 1)));
  const s1 = sz(t1), s2 = sz(t2), y2 = 164, y1 = y2 - s2 - 8;
  return `<svg class="thumb" viewBox="0 0 320 180" role="img" aria-label="${esc(t1)} ${esc(t2)}"><rect width="320" height="180" fill="#0E0D0C"/><rect width="320" height="180" fill="url(#tg)"/><text x="14" y="${y1}" font-size="${s1}" class="t1">${esc(t1 || '')}</text><text x="14" y="${y2}" font-size="${s2}" class="t2">${esc(t2 || '')}</text></svg>`;
}
/* rounds are keyed by the worldcup day (YYYY-MM-DD, device local time); phase follows the clock, with an admin override for the current round */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const p = String(s || '').split('-').map(Number); return p.length === 3 && !isNaN(p[0]) ? new Date(p[0], p[1] - 1, p[2]) : new Date(); };
const wcDays = () => { const s = S.settings; return (s && Array.isArray(s.wcDays) && s.wcDays.length) ? s.wcDays : [2, 5]; };

const koreaNow = () => new Date(new Date().toLocaleString('en-US', {timeZone: 'Asia/Seoul'}));
const curWeek = () => nextWcDate(koreaNow(), true);
const nextRound = w => nextWcDate(parseISO(w), false);
function phase() {
  const s = S.settings; if (!s) return 'upload';
  const now = koreaNow(), cur = curWeek();
  if (s.override && s.overrideRound === cur) return s.override;
  if (iso(now) !== cur) return 'upload';
  return now.getHours() < (s.endHour ?? 18) ? 'worldcup' : 'results';
}
const weekLabel = w => { const d = parseISO(w); return `${d.getMonth() + 1}/${d.getDate()} (${DAYS[d.getDay()]})`; };
const isPastRound = w => w < curWeek();
const isOps = () => S.role === 'owner' || S.role === 'ops';
const isMine = id => !!(S.mine.cards && S.mine.cards[id]);
const cardById = id => S.cards.find(c => c.id === id);
const commentCount = id => S.cards._cc ? (S.cards._cc[id] || 0) : null;
const targetWeek = () => phase() === 'upload' ? curWeek() : nextRound(curWeek());
const myLimit = () => S.isOwner ? (S.settings?.ownerCards ?? 2) : (S.settings?.perPerson ?? 5);

const myRunDone = w => !!S.runs.find(r => r.id === S.uid && r.weeks && r.weeks[w]);

  return !!card && (isOps() || isMine(card.id) || !!S.publicResults['w_'+card.weekId] || myRunDone(card.weekId));
}

// firebase-config.js를 글자로 읽어서 firebaseConfig = { ... } 부분만 꺼낸다.
// Firebase 콘솔이 보여주는 코드를 어떤 형태로 붙여넣어도(npm용·script용·import 줄 포함) 동작하게.
async function loadConfig() {
  let text = '';
  try { const r = await fetch('firebase-config.js', { cache: 'no-store' }); if (r.ok) text = await r.text(); } catch (e) {}
  const m = text.match(/\{[^{}]*apiKey[^{}]*\}/);
  if (!m) return null;
  try { const cfg = (new Function('return (' + m[0] + ')'))(); return cfg && cfg.apiKey && !/붙여넣/.test(cfg.apiKey) ? cfg : null; } catch (e) { return null; }
}
async function init() {
  showScreen('gate'); $('#gateTitle').textContent = '연결 중입니다'; $('#gateMsg').textContent = '';

  firebase.initializeApp(cfg);
  S.auth = firebase.auth(); S.db = firebase.firestore();

}
function ownerOf(settings) { return String((settings && settings.ownerEmail) || '').toLowerCase(); }

  if (S.busy) return; S.busy = true;

    await S.db.doc('settings/main').set(Object.assign({}, DEFAULT_SETTINGS, { ownerEmail: S.email, createdAt: Date.now() }));

async function onAuth(u) {

    try { await S.db.doc('members/' + email).set(m); } catch (e) { gate('규칙 설정이 안 됐습니다', 'Firestore 규칙(firestore.rules)을 콘솔에 붙여넣고 게시했는지 확인하세요. ' + (e.code || '')); return; }

  if (!m) {

    $('#gateMsg').innerHTML = `<span class="muted">${esc(email)} 계정은 아직 멤버가 아닙니다. 계란님이나 우재 PD에게 이 이메일을 추가해 달라고 하세요.</span><div style="margin-top:12px"><button class="btn sm" data-act="logout">다른 계정으로</button></div>`;

function subscribeAll() {
  const db = S.db, uid = S.uid;
  db.doc('settings/main').onSnapshot(s => { S.settings = s.exists ? s.data() : null; S.settingsLoaded = true; if (S.settings && (ownerOf(S.settings) === S.email) !== S.isOwner) { location.reload(); return; } render(); }, e => toast('설정을 읽지 못했습니다: ' + e.code));
  db.collection('profiles').onSnapshot(q => { const p = {}; q.docs.forEach(d => p[d.id] = d.data()); S.profiles = p; profilesInto(); }, e => {});
  db.collection('members').onSnapshot(q => { S.members = q.docs.map(d => Object.assign({ email: d.id }, d.data())); const me=S.members.find(m=>m.email===S.email); if(!S.isOwner && (!me || (me.role||'member')!==S.role)) {location.reload();return;} if (S.tab === 'admin') render(); }, e => {});
  setInterval(() => { if (S.ready && S.settings) render(); }, 60000);

  db.doc('users/' + uid + '/private/run').onSnapshot(s => { S.run = s.exists ? s.data() : null; render(); }, e => {});
  if (S.isOwner) db.collection('authors').onSnapshot(q => { const ix = { cards: {}, entries: {}, comments: {} }; q.docs.forEach(d => { const a = d.data(); Object.keys(a.cards || {}).forEach(k => ix.cards[k] = d.id); Object.keys(a.entries || {}).forEach(k => ix.entries[k] = d.id); Object.keys(a.comments || {}).forEach(k => ix.comments[k] = d.id); }); S.authorsIndex = ix; render(); }, e => {});
  db.collection('battles').onSnapshot(q => { S.battles = q.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); render(); }, e => {});
  if (isOps()) db.collection('pkruns').onSnapshot(q => { S.pkPublic = q.docs.map(d => Object.assign({ id: d.id }, d.data())); render(); }, e => {});
  else db.doc('pkruns/' + uid).onSnapshot(d => { S.pkPublic = d.exists ? [Object.assign({id:d.id}, d.data())] : []; render(); }, e => {});
  db.doc('users/' + uid + '/private/pkrun').onSnapshot(s => { S.pkRuns = s.exists ? s.data() : {}; render(); }, e => {});
  db.doc('users/' + uid + '/private/meta').onSnapshot(s => { S.meta = s.exists ? s.data() : { comments: {}, likes: {} }; if (S.meta.likeSchema !== 2) { S.meta.likes = {}; S.meta.likeSchema = 2; } if (!S.meta.comments) S.meta.comments = {}; if (!S.meta.likes) S.meta.likes = {}; render(); }, e => {});
}

/* board */
function tileHTML(c) {
  const cc = commentCount(c.id);
  const pills = [];
  if (c.status === 'selected') pills.push('<span class="pill on">선정</span>');
  if (c.urgent) pills.push('<span class="pill bad">긴급</span>');
  if (isMine(c.id)) pills.push('<span class="pill acc">내 카드</span>');
  if (c.revisedFrom) pills.push('<span class="pill">수정본</span>');
  return `<button class="tile" data-act="open" data-id="${esc(c.id)}">${thumbSVG(c.t1, c.t2)}<div class="tile-title">${esc(c.title)}</div><div class="tile-meta"><span>피지컬갤러리 · 연습생 ${esc(c.no || '')}</span>${cc ? `<span>· 코멘트 ${cc}</span>` : ''}${pills.join('')}</div></button>`;
}
function renderBoard() {
  const w = curWeek(), cur = S.cards.filter(c => c.weekId === w);
  const next = S.cards.filter(c => c.weekId > w);
  const pool = cur.filter(c => !c.urgent), urgent = cur.filter(c => c.urgent);
  const cap = S.settings.target || 16;
  const mineN = countMine(w);
  let html = `<div class="stack">
    <div class="between"><h2>${esc(weekLabel(w))} 월드컵 카드 <span class="muted num" style="font-weight:400">${pool.length}/${cap}</span></h2><span class="pill ${mineN >= myLimit() ? 'good' : ''}">내 카드 ${mineN}/${myLimit()}</span></div>
    <p class="small muted">${esc(S.settings.schedule || '')}</p>`;
  if (S.canWrite === false) html += `<div class="note">보기 전용 권한입니다. 카드를 올리거나 월드컵을 하려면 계란님에게 '편집자' 권한으로 다시 초대해 달라고 하세요.</div>`;
  if (urgent.length) html += `<h3 style="margin-top:4px">긴급 카드 <span class="muted small" style="font-weight:400">월드컵 없이 바로 회의 안건</span></h3><div class="feed">${urgent.map(tileHTML).join('')}</div>`;
  html += pool.length
    ? `<div class="feed">${pool.map(tileHTML).join('')}</div>`
    : `<div class="empty"><b>아직 올라온 카드가 없습니다</b>'올리기' 탭에서 첫 카드를 올려보세요. 작성자는 보이지 않습니다.</div>`;
  if (next.length) html += `<h3 style="margin-top:8px">다음 회차 대기 <span class="muted small" style="font-weight:400">${next.length}장 · ${esc(weekLabel(next[0].weekId))}</span></h3><div class="feed">${next.map(tileHTML).join('')}</div>`;
  const past = S.cards.filter(c => c.weekId < w);
  if (past.length) html += `<details class="more" style="margin-top:8px"><summary>지난 회차 카드 ${past.length}장</summary><div class="feed" style="margin-top:10px">${past.slice(0, 40).map(tileHTML).join('')}</div></details>`;
  html += `</div>`;
  $('#scr-board').innerHTML = html;
}

/* compose — the form follows how 계란님 writes an item: 소재 → 로그라인 → 시안 1·2·3안 → 왜 되나(누가/왜 누르나/왜 끝까지) → 데이터 근거 → 차이(이미 나온 것/새로 보여줄 것) → 유형 → 헛점·해소안 */

/* worldcup */
function makePairs(ids) {
  const a = shuffle(ids), p = [];
  for (let i = 0; i < a.length; i += 2) {
    p.push(a[i + 1] != null
      ? { 0: a[i], 1: a[i + 1], length: 2 }
      : { 0: a[i], length: 1 });
  }
  return p;
}
function roundPts(r) { return Math.min(r, 5); }
function startRound(run, remaining, dual) {
  run.remaining = remaining; run.pairs = makePairs(remaining); run.idx = 0; run.next = [];
  if (run.audit) run.audit.rounds.push({ pairs: JSON.parse(JSON.stringify(run.pairs)) });
  const bye = run.pairs.find(p => p.length === 1);
  if (bye) { run.next.push(bye[0]); run.points[bye[0]] = (run.points[bye[0]] || 0) + roundPts(run.round); run.pairs = run.pairs.filter(p => p.length === 2); run.byeId = bye[0]; } else run.byeId = null;
  run.dualLeft = remaining.length > 4 ? Math.max(0, Math.min(dual ?? 2, run.pairs.length - 1)) : 0;
}
function applyDecision(run, choice, dual) {
  const pair = run.pairs[run.idx]; if (!pair) return false;
  const pts = roundPts(run.round);
  const pass = id => { run.next.push(id); run.points[id] = (run.points[id] || 0) + pts; };
  if (choice === 'top') pass(pair[0]); else if (choice === 'bottom') pass(pair[1]); else { if (run.dualLeft <= 0) return false; pass(pair[0]); pass(pair[1]); run.dualLeft--; }
  if (run.audit) run.audit.choices.push(choice);
  run.idx++;
  if (run.idx >= run.pairs.length) {
    if (run.next.length <= 1) { run.done = true; run.finishedAt = Date.now(); return true; }
    run.round++; startRound(run, run.next, dual);
  }
  return false;
}
async function startRun() {
  if (S.busy) return;
  const w = curWeek(); const pool = poolFor(w).filter(c => !isMine(c.id)).map(c => c.id);
  if (pool.length < 2) { toast('월드컵을 하려면 내 카드를 뺀 카드가 2장 이상 있어야 합니다'); return; }
  if (phase() !== 'worldcup' || myRunDone(w)) { toast('진행 시간이 아니거나 이미 완료했습니다'); return; }
  const run = { weekId: w, round: 1, points: {}, seen: pool.slice(), done: false, startedAt: Date.now(), audit:{v:1,dual:S.settings.dualPass ?? 2,rounds:[],choices:[]} };
  startRound(run, pool, S.settings.dualPass ?? 2);
  try { await S.db.runTransaction(async tx=>{const ref=S.db.doc('roundLocks/'+w);const snap=await tx.get(ref);if(!snap.exists)tx.set(ref,{locked:true});}); } catch(e){toast('대진 잠금 실패: '+(e.code||e.message));return;}
  await saveRun(run);
}
async function saveRun(run) {
  S.busy = true;
  try { await S.db.doc('users/' + S.uid + '/private/run').set(run); S.run = run; return true; }
  catch (e) { toast('저장 실패: ' + (e.code || e.message)); return false; }
  finally { S.busy = false; render(); }
}

async function decide(choice) {
  if (S.busy || !S.run || S.run.done || phase() !== 'worldcup') return;
  const run = JSON.parse(JSON.stringify(S.run)); if (!run.pairs[run.idx]) return;
  const done = applyDecision(run, choice, S.settings.dualPass ?? 2);
  if (await saveRun(run)) { if (done) await publishRun(run); }
}
async function publishRun(run) {
  try {
    const ref = S.db.doc('runs/' + S.uid);
    await S.db.runTransaction(async tx => {
      const s = await tx.get(ref), prev = s.exists ? s.data() : {};
      if (prev.weeks && prev.weeks[run.weekId]) return;
      const weeks = Object.assign({}, prev.weeks || {});
      weeks[run.weekId] = {points:run.points, seen:run.seen, finishedAt:run.finishedAt, audit:run.audit};
      tx.set(ref, {weeks, _key:run.weekId});
      tx.set(S.db.doc('participation/w_' + run.weekId + '_' + S.uid), {kind:'week', refId:run.weekId, uid:S.uid});
    });
    toast('월드컵 완료! 이제 다른 사람 코멘트를 볼 수 있습니다', 3000);
  } catch (e) { toast('집계 등록 실패: 아래 재시도 버튼을 눌러주세요. ' + (e.code || e.message), 6000); }
  render();
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const draw = (w, h, q) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h); return cv.toDataURL('image/jpeg', q); };
      let r = Math.min(1, 800 / img.width), w = Math.round(img.width * r), h = Math.round(img.height * r), q = 0.82, out = draw(w, h, q);
      while (out.length > 180000 && q > 0.45) { q -= 0.1; out = draw(w, h, q); }
      while (out.length > 180000 && w > 320) { w = Math.round(w * 0.75); h = Math.round(h * 0.75); out = draw(w, h, 0.7); }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 읽지 못했습니다')); };
    img.src = url;
  });
}

/* results */
function standings(w) {
  if (!isOps()) { const r=S.publicResults['w_'+w] || {n:0,scores:{}}; return {n:r.n, rows:S.cards.filter(c=>c.weekId===w&&!c.urgent).map(card=>Object.assign({card,total:0,exp:0,norm:0},r.scores[card.id]||{})).sort((a,b)=>b.norm-a.norm||b.total-a.total||(a.card.createdAt||0)-(b.card.createdAt||0))}; }
  const done = S.runs.map(r => r.weeks && r.weeks[w]).filter(Boolean).map(v => verifiedVote(v, poolFor(w).map(c => c.id))).filter(Boolean); const n = done.length;
  const cards = S.cards.filter(c => c.weekId === w && !c.urgent);
  const rows = cards.map(c => { let total = 0, exp = 0; done.forEach(r => { if (r.seen && r.seen.includes(c.id)) { exp++; total += (r.points && r.points[c.id]) || 0; } }); return { card: c, total, exp, norm: exp ? total / exp * n : 0 }; });
  rows.sort((x, y) => y.norm - x.norm || y.total - x.total || (x.card.createdAt || 0) - (y.card.createdAt || 0));
  return { rows, n };
}
function renderResults() {
  const el = $('#scr-results'); const w = curWeek(); const ph = phase();
  const weeks = [...new Set(S.cards.map(c => c.weekId))].filter(x => x < w || (x === w && ph === 'results')).sort((a, b) => (a < b ? 1 : a > b ? -1 : 0));
  if (!S.resultsWeek || !weeks.includes(S.resultsWeek)) S.resultsWeek = weeks[0] || null;
  const doneN = doneCount('week',w);
  let html = `<div class="stack"><div class="between"><h2>결과</h2>${weeks.length > 1 ? `<select id="rw" data-act="pickWeek">${weeks.map(x => `<option value="${x}" ${x === S.resultsWeek ? 'selected' : ''}>${esc(weekLabel(x))}</option>`).join('')}</select>` : ''}</div>`;
  if (ph === 'worldcup') html += `<div class="note">${esc(weekLabel(w))} 월드컵 진행 중 · 완료 ${doneN}명. ${S.settings.endHour ?? 18}:00에 전원 합산으로 열립니다.</div>`;
  if (!isOps() && weeks.some(x => !S.publicResults['w_'+x])) html += '<div class="note">공개 집계가 아직 없습니다. 계란님 또는 우재가 관리 탭에서 결과를 집계·공개해주세요.</div>';
  if (weeks.length === 0) html += `<div class="empty"><b>아직 결과가 없습니다</b>첫 월드컵이 끝나면 여기에 순위가 나옵니다.</div></div>`;
  if (!S.resultsWeek) { el.innerHTML = html + '</div>'; return; }
  const rw = S.resultsWeek; const { rows, n } = standings(rw);
  const urgent = S.cards.filter(c => c.weekId === rw && c.urgent);
  html += `<div class="between"><h3>${esc(weekLabel(rw))} 순위 <span class="muted small" style="font-weight:400">${n}명 합산</span></h3>${S.isOwner ? '<span class="pill acc">선정은 계란님만</span>' : ''}</div>`;
  if (!rows.length) html += `<div class="empty"><b>카드가 없습니다</b></div>`;
  html += `<div class="card" style="padding:4px 12px">${rows.map((r, i) => {
    const c = r.card; const sel = c.status === 'selected';
    return `<div class="rank ${i < 8 ? 'top' : ''}"><div class="n num">${i + 1}</div><button class="tile th" data-act="open" data-id="${esc(c.id)}">${thumbSVG(c.t1, c.t2)}</button><div class="body"><div class="ttl">${esc(c.title)}</div><div class="sc num"><b>${r.norm.toFixed(1)}</b>점 · 원점수 ${r.total} · ${r.exp}/${n}명이 봄${commentCount(c.id) ? ` · 코멘트 ${commentCount(c.id)}` : ''}</div>
      <div class="row" style="margin-top:6px">${sel ? `<span class="pill on">선정</span><span class="small">작성자 <b data-name="${esc(c.authorUid || '')}">${c.authorUid ? '…' : '(작성자가 앱을 열면 표시)'}</b></span>` : ownerTag('cards', c.id)}${S.isOwner ? (sel ? `<button class="btn sm ghost" data-act="unselect" data-id="${esc(c.id)}">선정 취소</button>` : `<button class="btn sm primary" data-act="select" data-id="${esc(c.id)}">선정</button>`) : ''}</div></div></div>`;
  }).join('')}</div>`;
  if (urgent.length) html += `<h3>긴급 카드 <span class="muted small" style="font-weight:400">월드컵 미경유</span></h3><div class="feed">${urgent.map(tileHTML).join('')}</div>`;
  html += `<p class="small muted">환산 점수 = 카드별 평균 점수 × 참여 인원. 본 사람 수가 다른 카드끼리 공평하게 비교하기 위한 값입니다. 상위 8장이 강조됩니다.</p></div>`;
  el.innerHTML = html;
  profilesInto(rows.map(r => r.card.authorUid).concat(S.isOwner && S.authorsIndex ? rows.map(r => S.authorsIndex.cards[r.card.id]) : []));
}
async function selectCard(id, on) {
  if (S.busy) return; S.busy = true;
  try {
    if (on) {
      let author = (S.authorsIndex && S.authorsIndex.cards[id]) || null;
      if (!author) { const q = await S.db.collection('authors').get(); q.docs.forEach(d => { const data = d.data(); if (data.cards && data.cards[id]) author = d.id; }); }
      await S.db.doc('cards/' + id).update({ status: 'selected', authorUid: author, selectedAt: Date.now() });
      toast(author ? '선정했습니다. 작성자가 공개됩니다' : '선정했습니다. 작성자는 본인이 앱을 열면 표시됩니다');
    } else { await S.db.doc('cards/' + id).update({ status: 'active', authorUid: null }); toast('선정을 취소했습니다'); }
  } catch (e) { toast('실패: ' + (e.code || e.message)); }
  S.busy = false;
}

async function setOverride(v) {
  if (S.busy) return; S.busy = true;
  try { await S.db.doc('settings/main').update(v ? { override: v, overrideRound: curWeek() } : { override: null, overrideRound: null }); toast(v ? `이번 회차를 '${PHASE[v]}'로 강제했습니다` : '자동 단계로 돌아갑니다'); } catch (e) { toast('실패: ' + (e.code || e.message)); }
  S.busy = false;
}
async function saveSettings() {
  const g = id => $('#' + id).value; const n = (id, d) => { const v = parseInt(g(id), 10); return isNaN(v) ? d : v; };
  const days = [...document.querySelectorAll('[data-wcday]')].filter(i => i.checked).map(i => parseInt(i.dataset.wcday, 10));
  if (!days.length) { toast('월드컵 요일을 하나 이상 고르세요'); return; }
  try { await S.db.doc('settings/main').update({ wcDays: days, endHour: Math.min(23, Math.max(1, n('s_endHour', 18))), target: n('s_target', 16), schedule: g('s_schedule').trim(), perPerson: n('s_perPerson', 3), ownerCards: n('s_ownerCards', 2), dualPass: n('s_dualPass', 2), detailFrom: n('s_detailFrom', 2), pkPerPerson: n('s_pkPerPerson', 3), pkDualPass: n('s_pkDualPass', 1) }); toast('저장했습니다'); } catch (e) { toast('실패: ' + (e.code || e.message)); }
}
async function ownerSave() {
  const em = ($('#o_email').value || '').trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast('이메일 형식을 확인하세요'); return; }
  if (em === ownerOf(S.settings)) { toast('지금과 같은 계정입니다'); return; }
  if (!S.members.some(m => m.email === em)) { toast('먼저 그 이메일을 멤버에 추가하세요'); return; }
  try {
    await S.db.doc('members/' + em).update({ role: 'owner' }).catch(() => {});
    await S.db.doc('members/' + S.email).update({ role: 'ops' }).catch(() => {});
    await S.db.doc('settings/main').update({ ownerEmail: em }); // 이게 바뀌면 화면이 새로 고쳐진다
    toast('계란님 계정을 바꿨습니다');
  } catch (e) { toast('실패: ' + (e.code || e.message)); }
}

/* events */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab]'); if (!t) return;
  if (t.dataset.tab) { setTab(t.dataset.tab); return; }
  const act = t.dataset.act, id = t.dataset.id, v = t.dataset.v;
  switch (act) {
    case 'open': openDetail(id); break;
    case 'close': closeDetail(); break;
    case 'goBoard': setTab('board'); break;
    case 'setType': { const i = S.compose.types.indexOf(v); if (i >= 0) { if (S.compose.types.length > 1) S.compose.types.splice(i, 1); } else S.compose.types.push(v); saveDraft(); renderCompose(); break; }
    case 'setKind': S.compose.kind = v; saveDraft(); renderCompose(); break;
    case 'submitCard': submitCard(); break;
    case 'clearDraft': lsDel('draft'); S.compose.revisedFrom = null; S.compose.types = [TYPES[0]]; clearComposeForm(); renderCompose(); break;
    case 'dropRevised': S.compose.revisedFrom = null; saveDraft(); renderCompose(); break;
    case 'revise': { const c = cardById(id); if (c) { closeDetail(); setTab('compose'); fillComposeFrom(c); renderCompose(); toast('내용을 불러왔습니다. 고쳐서 올리세요'); } break; }
    case 'deleteCard': { const c = cardById(id); if (!c) break; if (t.dataset.sure) deleteCard(id); else { t.dataset.sure = '1'; t.textContent = '정말 삭제 (한 번 더)'; } break; }
    case 'cmType': { const box = t.closest('[data-composer]'); box.querySelectorAll('[data-act="cmType"]').forEach(b => b.classList.toggle('on', b === t)); box.querySelector('[data-part="develop"]').hidden = v !== 'develop'; box.querySelector('[data-part="tackle"]').hidden = v !== 'tackle'; break; }
    case 'sendComment': sendComment(t); break;
    case 'like': toggleLike(id); break;
    case 'adopt': toggleAdopt(id); break;
    case 'publishResults': publishResults(); break;
    case 'retryRun': if(S.run && S.run.audit) publishRun(S.run); else toast('업데이트 전 미등록 기록입니다. 운영자에게 확인해주세요'); break;
    case 'retryPk': {const r=S.pkRuns[S.pkOpen]; if(r && r.audit) publishPkRun(S.pkOpen,r); else toast('업데이트 전 미등록 기록입니다. 운영자에게 확인해주세요'); break;}
    case 'startRun': startRun(); break;
    case 'restartRun': startRun(); break;
    case 'decide': decide(v); break;
    case 'wcComment': S.wcCommentOpen[t.dataset.key] = !S.wcCommentOpen[t.dataset.key]; render(); break;
    case 'select': selectCard(id, true); break;
    case 'unselect': selectCard(id, false); break;
    case 'override': setOverride(v || null); break;
    case 'login': login(); break;
    case 'logout': S.auth.signOut().then(() => location.reload()); break;
    case 'memberAdd': { const em = ($('#m_email').value || '').trim().toLowerCase(); const role = $('#m_role').value; if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast('이메일 형식을 확인하세요'); break; } S.db.doc('members/' + em).set({ role, name: '', addedAt: Date.now(), addedBy: S.email }).then(() => { toast('추가했습니다. 그 계정으로 로그인하면 바로 들어옵니다'); $('#m_email').value = ''; }).catch(e => toast('실패: ' + (e.code || e.message))); break; }
    case 'memberRole': S.db.doc('members/' + id).update({ role: v }).then(() => toast('바꿨습니다')).catch(e => toast('실패: ' + (e.code || e.message))); break;
    case 'memberRemove': { if (t.dataset.sure) S.db.doc('members/' + id).delete().then(() => toast('뺐습니다')).catch(e => toast('실패: ' + (e.code || e.message))); else { t.dataset.sure = '1'; t.textContent = '정말 빼기'; } break; }
    case 'openBattle': openBattle(id); break;
    case 'closeBattle': closeBattle(); break;
    case 'pkNew': S.pkNew = true; render(); window.scrollTo({ top: 0 }); break;
    case 'pkCancelNew': S.pkNew = false; render(); break;
    case 'pkCreate': pkCreate(); break;
    case 'pkImgClear': S.pkImg = null; render(); break;
    case 'pkSubmit': pkSubmit(); break;
    case 'pkDelete': { if (t.dataset.sure) pkDeleteEntry(id); else { t.dataset.sure = '1'; t.textContent = '정말 삭제 (한 번 더)'; } break; }
    case 'pkState': pkSetState(v); break;
    case 'pkDeleteBattle': pkDeleteBattle(); break;
    case 'pkStart': pkStart(); break;
    case 'pkDecide': pkDecide(v); break;
    case 'pkSelect': pkSelect(id, v === '1'); break;
    case 'none': break;
    case 'saveSettings': saveSettings(); break;
    case 'claimOwner': claimOwner(); break;
    case 'ownerSave': ownerSave(); break;
  }
});
document.addEventListener('change', e => { if (e.target.id === 'rw') { S.resultsWeek = e.target.value; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.openCard) closeDetail(); });

/* Internal-team security update. Existing cards and author bindings are never migrated/deleted. */
function registerAuthor(batch, kind, id, value) {
  batch.set(S.db.doc('authors/' + S.uid), {[kind]:{[id]:value}, _change:{kind,id}}, {merge:true});
}
function doneCount(kind, id) {
  const live = new Set(S.participation.filter(p=>p.kind===kind && p.refId===id).map(p=>p.uid));
  const raw = kind==='week' ? S.runs.filter(r=>r.weeks&&r.weeks[id]) : S.pkPublic.filter(r=>r.battles&&r.battles[id]);
  raw.forEach(r=>live.add(r.id));
  const pub=S.publicResults[(kind==='week'?'w_':'b_')+id];
  return Math.max(live.size, pub ? pub.n : 0);
}
function refreshComments() {
  if(!S.db || !S.ready) return;
  const card=cardById(S.openCard), allowed=card && canSeeComments(card);
  const ids=card ? Object.keys(S.mine.comments||{}).filter(id=>S.mine.comments[id]===card.id) : [];
  const key=card ? card.id+':'+!!allowed+':'+ids.join(',') : '';
  if(key===S.commentsKey) return;
  S.commentsKey=key; S.commentStops.forEach(stop=>stop()); S.commentStops=[]; S.comments=[]; S.allComments=[];
  if(!card) return;
  const cache={};
  const update=()=>{ if(S.commentsKey!==key)return; S.allComments=Object.values(cache); S.comments=S.allComments.slice().sort((a,b)=>(b.likes||0)-(a.likes||0)||(a.createdAt||0)-(b.createdAt||0)); render(); };
  if(allowed) S.commentStops.push(S.db.collection('comments').where('cardId','==',card.id).where('weekId','==',card.weekId).onSnapshot(q=>{ Object.keys(cache).forEach(k=>delete cache[k]); q.docs.forEach(d=>cache[d.id]=Object.assign({id:d.id},d.data())); update(); },e=>toast('코멘트 읽기 실패: '+e.code)));
  else ids.forEach(id=>S.commentStops.push(S.db.doc('comments/'+id).onSnapshot(d=>{if(d.exists)cache[d.id]=Object.assign({id:d.id},d.data());else delete cache[d.id];update();},()=>{})));
}
// Recompute scores from pairings and choices. A forged points map is ignored.
// This is an internal-team integrity check, not server attestation of UI activity.
function verifiedVote(v, eligible) {
  try {
    if(!v || !Array.isArray(v.seen) || v.seen.length<2 || v.seen.length>200) return null;
    const set=new Set(v.seen); if(set.size!==v.seen.length || v.seen.some(id=>typeof id!=='string'||!eligible.includes(id)))return null;
    if(!v.audit) { // Preserve already-stored legacy results; new writes require audit v1.
      const pts=v.points||{}, cap=5*(v.seen.length-1);
      if(Object.keys(pts).some(id=>!set.has(id)||!Number.isInteger(pts[id])||pts[id]<0||pts[id]>cap))return null;
      return {seen:v.seen,points:pts,legacy:true};
    }
    const a=v.audit;
    if(a.v!==1 || !Number.isInteger(a.dual) || a.dual<0 || a.dual>100 || !Array.isArray(a.rounds)||!Array.isArray(a.choices))return null;
    let remaining=v.seen.slice(), at=0, round=0, points={};
    for(const storedRound of a.rounds) {
      const rawPairs = Array.isArray(storedRound) ? storedRound : storedRound?.pairs;
      if (!Array.isArray(rawPairs)) return null;
      const pairs = rawPairs.map(p => {
        if (Array.isArray(p)) return p;
        if (!p || (p.length !== 1 && p.length !== 2)) return null;
        return p.length === 1 ? [p[0]] : [p[0], p[1]];
      });
      round++; if(remaining.length<=1 || round>200 || !Array.isArray(pairs)||pairs.length!==Math.ceil(remaining.length/2))return null;
      if(pairs.some(p=>!Array.isArray(p)||(p.length!==1&&p.length!==2)))return null;
      const flat=pairs.flat(); if(flat.length!==remaining.length||new Set(flat).size!==flat.length||flat.some(id=>!remaining.includes(id)))return null;
      if(pairs.filter(p=>p.length===1).length!==remaining.length%2)return null;
      let dual=remaining.length>4 ? Math.max(0,Math.min(a.dual,Math.floor(remaining.length/2)-1)) : 0;
      const next=[],pass=id=>{next.push(id);points[id]=(points[id]||0)+Math.min(round,5);};
      pairs.filter(p=>p.length===1).forEach(p=>pass(p[0]));
      for(const p of pairs.filter(p=>p.length===2)) {
        const ch=a.choices[at++];
        if(ch==='top')pass(p[0]); else if(ch==='bottom')pass(p[1]); else if(ch==='both'&&dual>0){pass(p[0]);pass(p[1]);dual--;} else return null;
      }
      remaining=next;
    }
    if(remaining.length!==1||at!==a.choices.length)return null;
    return {seen:v.seen,points};
  } catch(e) {return null;}
}
async function publishPkRun(id, run) {
  try {
    const ref=S.db.doc('pkruns/'+S.uid);
    await S.db.runTransaction(async tx=>{
      const snap=await tx.get(ref),prev=snap.exists?snap.data():{};
      if(prev.battles&&prev.battles[id])return;
      const battles=Object.assign({},prev.battles||{});
      battles[id]={points:run.points,seen:run.seen,finishedAt:run.finishedAt,audit:run.audit};
      tx.set(ref,{battles,_key:id});
      tx.set(S.db.doc('participation/b_'+id+'_'+S.uid),{kind:'battle',refId:id,uid:S.uid});
    });toast('투표 완료!');
  } catch(e){toast('집계 등록 실패: 재시도 버튼을 눌러주세요. '+(e.code||e.message),6000);}
  render();
}
async function publishResults() {
  if(!isOps()||S.busy)return; S.busy=true;
  try {
    const fresh=await Promise.all(['runs','pkruns','cards','battles'].map(c=>S.db.collection(c).get()));
    const data=q=>q.docs.map(d=>Object.assign({id:d.id},d.data()));
    S.runs=data(fresh[0]);S.pkPublic=data(fresh[1]);S.cards=data(fresh[2]);S.battles=data(fresh[3]);
    const w=curWeek(), weeks=[...new Set(S.cards.map(c=>c.weekId))].filter(x=>x<w||(x===w&&phase()==='results'));
    let n=0,invalid=0,legacy=0;
    const summarize=(votes,eligible)=>{ const checked=votes.map(v=>verifiedVote(v,eligible)); invalid+=checked.filter(v=>!v).length; legacy+=checked.filter(v=>v&&v.legacy).length; const ok=checked.filter(Boolean), scores={}; eligible.forEach(id=>{let total=0,exp=0;ok.forEach(v=>{if(v.seen.includes(id)){exp++;total+=v.points[id]||0;}});scores[id]={total,exp,norm:exp?total/exp*ok.length:0};});return {n:ok.length,scores}; };
    for(const id of weeks){const data=summarize(S.runs.map(r=>r.weeks&&r.weeks[id]).filter(Boolean),poolFor(id).map(c=>c.id));await S.db.doc('results/w_'+id).set(Object.assign({kind:'week',refId:id,updatedAt:Date.now()},data));n++;}
    for(const b of S.battles.filter(b=>b.state==='closed')) {
      const q=await S.db.collection('entries').where('battleId','==',b.id).get();
      const data=summarize(S.pkPublic.map(r=>r.battles&&r.battles[b.id]).filter(Boolean),q.docs.map(d=>d.id));
      await S.db.doc('results/b_'+b.id).set(Object.assign({kind:'battle',refId:b.id,updatedAt:Date.now()},data));n++;
    }
    toast(n ? `${n}개 결과 공개·갱신 완료. 제외 기록 ${invalid}개${legacy?`, 기존 방식 기록 ${legacy}개 유지`:''}` : '아직 마감된 회차·종료된 배틀이 없습니다',6000);
  }catch(e){toast('집계 공개 실패: '+(e.code||e.message),6000);}finally{S.busy=false;render();}
}

init();
})();
